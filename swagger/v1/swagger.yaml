---
openapi: 3.0.1
info:
  title: Rails API
  version: v1
  description: Task management API with JWT authentication
paths:
  "/api/v1/register":
    post:
      summary: Register a new user
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: registered
        '422':
          description: invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
              - email
              - password
              - password_confirmation
  "/api/v1/login":
    post:
      summary: Login
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: logged in
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
  "/api/v1/tasks":
    get:
      summary: List tasks
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: priority
        in: query
        required: false
        schema:
          type: integer
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: tasks listed
        '401':
          description: unauthorized
    post:
      summary: Create a task
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters: []
      responses:
        '201':
          description: created
        '422':
          description: invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                priority:
                  type: integer
                category_id:
                  type: integer
              required:
              - title
              - status
              - priority
              - category_id
  "/api/v1/tasks/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get a task
      tags:
      - Tasks
      security:
      - Bearer: []
      responses:
        '200':
          description: task found
        '404':
          description: not found
    put:
      summary: Update a task
      tags:
      - Tasks
      security:
      - Bearer: []
      parameters: []
      responses:
        '200':
          description: updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                status:
                  type: string
                priority:
                  type: integer
    delete:
      summary: Delete a task
      tags:
      - Tasks
      security:
      - Bearer: []
      responses:
        '204':
          description: deleted
  "/api/v1/categories":
    get:
      summary: List categories
      tags:
      - Categories
      security:
      - Bearer: []
      responses:
        '200':
          description: categories listed
servers:
- url: https://rails-api-zm3n.onrender.com
  description: Production
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
